name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Never stop a run on main halfway through publishing the image.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Tests run on the embedded Postgres (PGlite); no database service is needed.
      - run: npm test
      - run: npm run build

  postgres:
    name: Server tests on Postgres 18
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The whole server suite, each test file on its own copy of a migrated template
      # database, plus postgres.test.ts, which only runs here: concurrent claims and the
      # row locks bulk review takes, on connections that really run in parallel.
      - run: npm test -w @crowd/server
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  load:
    name: Load test (k6, claim → submit on Postgres 18)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Per-statement timings and plans for load/profile.mjs. A service container takes no
      # server options, so set them and restart it. auto_explain instruments 2% of
      # statements and logs the plan, with buffers, of those that take 5 ms or more: the
      # statements of a claim and a submit take a few ms each.
      - name: Turn on pg_stat_statements and auto_explain
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          echo "PG_CONTAINER=$PG_CONTAINER" >> "$GITHUB_ENV"
          pg() { docker exec "$PG_CONTAINER" "$@"; }
          pg psql -U postgres \
            -c "alter system set shared_preload_libraries = 'pg_stat_statements', 'auto_explain'" \
            -c "alter system set pg_stat_statements.track_planning = on"
          docker restart "$PG_CONTAINER"
          for _ in $(seq 1 30); do pg pg_isready -U postgres && break; sleep 1; done
          pg pg_isready -U postgres || { docker logs --tail 30 "$PG_CONTAINER"; exit 1; }
          pg psql -U postgres -c "create extension pg_stat_statements" \
            -c "alter system set auto_explain.log_min_duration = '5ms'" \
            -c "alter system set auto_explain.log_analyze = on" \
            -c "alter system set auto_explain.log_buffers = on" \
            -c "alter system set auto_explain.sample_rate = 0.02" \
            -c "select pg_reload_conf()"
      - name: Start the server
        run: |
          # The probes time waits on the pg pool and profile the main thread's CPU from
          # outside the app; see load/pool-probe.mjs and load/cpu-probe.mjs.
          nohup node --import ./load/pool-probe.mjs --import ./load/cpu-probe.mjs \
            apps/server/dist/index.js > server.log 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4000/api/health && exit 0
            sleep 1
          done
          cat server.log
          exit 1
        env:
          NODE_ENV: production
          # Plain http on localhost: k6 would not send a Secure cookie back.
          COOKIE_SECURE: 'false'
      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: '2.3.0'
      # 2 × 12 annotators, each looping claim → submit until nothing is left for them, on
      # 4,000 items with redundancy 1 and 4,000 with redundancy 2.
      - name: Run k6
        id: k6
        run: |
          node load/profile.mjs start
          k6 run load/claim-submit.js
        env:
          VUS: 12
          ITEMS: 4000
      - name: Where the time went
        if: ${{ !cancelled() && steps.k6.outcome != 'skipped' }}
        run: node load/profile.mjs report k6-summary.json
      - name: Where the server's CPU went
        if: ${{ !cancelled() && steps.k6.outcome != 'skipped' }}
        run: node load/cpu-report.mjs
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.k6.outcome != 'skipped' }}
        with:
          name: server-cpu-profile
          path: server.cpuprofile
          retention-days: 14
          if-no-files-found: ignore
      - name: Check every item was answered exactly as often as its redundancy asks
        if: ${{ !cancelled() && steps.k6.outcome != 'skipped' }}
        run: node load/check.mjs k6-summary.json
      - name: Server log
        if: failure()
        run: tail -n 100 server.log

  image:
    name: Container image (build and smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: crowd-annotation:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: bash scripts/docker-smoke.sh crowd-annotation:ci

  demo:
    name: Demo image (as Render builds it, within 512 MB)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@v4
      # Render passes the service's DEMO_MODE=true to the build, which then seeds the demo.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: crowd-annotation:demo
          build-args: DEMO_MODE=true
          cache-from: type=gha
      - name: Smoke test, then again within 512 MB and no swap
        run: bash scripts/docker-smoke.sh --demo crowd-annotation:demo

  publish:
    name: Publish the image to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, postgres, load, image]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # Provenance comes from the GitHub attestation below instead.
          provenance: false
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Pull the published image, verify its attestation, smoke-test it
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: |
          docker pull "$IMAGE"
          gh attestation verify "oci://$IMAGE" --repo "$GITHUB_REPOSITORY"
          bash scripts/docker-smoke.sh "$IMAGE"
          echo "::notice title=Published::$IMAGE"
